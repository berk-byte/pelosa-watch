name: watch

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification at startup"
        type: boolean
        default: false

# One run polls for up to LOOP_MINUTES; newer triggers queue up (not cancel)
# and take over the moment the running one finishes, so skipped cron fires
# don't create coverage gaps.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          LOOP_MINUTES: "200"
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python3 watcher.py
